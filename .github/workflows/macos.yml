name: macOS
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: Tests/run.sh
      - run: xcodebuild -project WhaleRemote.xcodeproj -scheme WhaleRemote -configuration Release build

  package:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WhaleRemote-macOS
          path: dist/*.dmg
          if-no-files-found: error
