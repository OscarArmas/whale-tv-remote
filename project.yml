name: WhaleRemote
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.local.WhaleRemote
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    COMBINE_HIDPI_IMAGES: "YES"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: WhaleRemote/Info.plist
    LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    ENABLE_APP_SANDBOX: "NO"
targets:
  WhaleRemote:
    type: application
    platform: macOS
    sources:
      - WhaleRemote
    settings:
      base:
        PRODUCT_NAME: Whale Remote
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "6"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: WhaleRemote/Info.plist
      properties:
        CFBundleDisplayName: Whale Remote
        NSLocalNetworkUsageDescription: Whale Remote busca el televisor en tu Wi‑Fi para enviarle las teclas del mando. No usa internet ni cuentas.
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "13.0"
    scheme:
      testTargets: []
